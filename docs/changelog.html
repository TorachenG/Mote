<style>
  .release + .release{margin-top:var(--gap)}
  .release-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .dl-mini{
    margin-left:auto;
    display:inline-flex;align-items:center;justify-content:center;
    padding:10px 16px;border-radius:10px;
    background:#3482ff;color:#fff;
    font-size:13px;font-weight:500;letter-spacing:.2px;
    line-height:1.2;text-decoration:none;white-space:nowrap;
    transition:background .16s ease;
  }
  .dl-mini:hover{background:#2a70e4}
  .dl-mini:active{background:#2360cc}
  .release-tag{font-size:17px;font-weight:600;color:var(--text);letter-spacing:.4px}
  .release-date{color:var(--muted);font-size:13px}
  .release-badge{
    font-size:12px;padding:2px 9px;border-radius:999px;
    background:#eef3fb;color:#5c7eb8;letter-spacing:.4px;
  }
  .release .doc{font-size:14.5px}
  .release .doc h2{font-size:15.5px;margin:18px 0 8px}
  .release .doc h3{font-size:14.5px;margin:16px 0 6px}
  .release .doc p{margin:8px 0}
  .state{padding:28px 0;text-align:center;color:var(--muted)}

  @media (prefers-color-scheme: dark) {
    .release-badge{background:#1e2a3a;color:#8fb4ea}
    .state{color:#8f97a4}
  }
</style>

    <nav>

      <div class="nav-item">
        <a class="nav-link" href="javascript:void(0)">源码仓库</a>
        <div class="dropdown">
          <a href="https://github.com/TorachenG/Mote" target="_blank" rel="noopener">GitHub</a>
          <a href="https://gitee.com/TorachenG/Mote" target="_blank" rel="noopener">Gitee</a>
        </div>
      </div><i>|</i>
      <a href="changelog.html" class="active">更新日志</a><i>|</i>
      <div class="nav-item">
        <a class="nav-link" href="javascript:void(0)">用户协议</a>

  <div class="wrap" style="padding-top:12px">
    <div class="page-head">
      <h1>更新日志</h1>

<script src="assets/nav.js"></script>

  <script>
  (function () {
    const list = document.getElementById('list');
    const p = (n) => String(n).padStart(2, '0');

    function card(r) {
      const tag = r.tag || '未命名版本';
      const d = r.publishedAt ? new Date(r.publishedAt) : null;
      const date = d ? d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) : '';
      const body = window.renderMarkdown(r.body || '') || '<p>该版本没有附加说明。</p>';
      const badge = r.prerelease ? '<span class="release-badge">预发布</span>' : '';
      const apk = (r.assets || []).find(function (a) { return /\.apk$/i.test(a.name || ''); });
      let dlButton = '';
      if (apk && apk.url) {
        const known = apk.size ? '（' + (apk.size / 1048576).toFixed(1) + 'MB）' : '';
        dlButton = '<a class="dl-mini" href="' + apk.url + '"' +
          ' data-apk="' + apk.url + '"' +
          ' data-tag="' + tag + '"' +
          (apk.size ? ' data-size="' + apk.size + '"' : '') +
          '>下载' + known + '</a>';
      } else if (r.pageUrl) {
        dlButton = '<a class="dl-mini" href="' + r.pageUrl + '" target="_blank" rel="noopener">前往下载</a>';
      }
      return '<div class="card release">' +
        '<div class="release-head">' +
          '<span class="release-tag">v' + tag + '</span>' +
          badge +
          '<span class="release-date">' + date + '</span>' +
          dlButton +
        '</div>' +
        '<article class="doc">' + body + '</article>' +
      '</div>';
    }


    // 每个版本的下载按钮补齐安装包大小：GitHub 映射优先，缺失再 HEAD 读取
    async function hydrateDownloadSizes() {
      const buttons = Array.prototype.slice.call(
        document.querySelectorAll('.dl-mini[data-apk]')
      );
      if (!buttons.length) return;

      let sizeByTag = {};
      try {
        const res = await fetch(
          'https://api.github.com/repos/TorachenG/Mote/releases?per_page=100',
          { headers: { Accept: 'application/vnd.github+json' } }
        );
        if (res.ok) {
          const list = await res.json();
          (list || []).forEach(function (rel) {
            const asset = (rel.assets || []).find(function (a) {
              return /\.apk$/i.test(a.name || '');
            });
            if (asset && asset.size) {
              sizeByTag[String(rel.tag_name || '').replace(/^v/i, '')] = asset.size;
            }
          });
        }
      } catch (e) {}

      await Promise.all(buttons.map(async function (btn) {
        let bytes = Number(btn.getAttribute('data-size')) || 0;
        if (!bytes) bytes = sizeByTag[btn.getAttribute('data-tag')] || 0;
        if (!bytes) {
          try {
            const head = await fetch(btn.getAttribute('data-apk'), { method: 'HEAD' });
            const len = head.headers.get('content-length');
            if (len) bytes = Number(len) || 0;
          } catch (e) {}
        }
        if (bytes > 0) {
          const label = '下载（' + (bytes / 1048576).toFixed(1) + 'MB）';
          const from = btn.getBoundingClientRect().width;
          btn.textContent = label;
          const to = btn.getBoundingClientRect().width;
          if (from && to && Math.abs(to - from) > 0.5) {
            // 与主页下载按钮一致的宽度展开动画
            btn.style.width = from + 'px';
            btn.style.overflow = 'hidden';
            btn.style.transition = 'background .16s ease, width 280ms cubic-bezier(0.22, 0.61, 0.36, 1)';
            void btn.offsetWidth;
            btn.style.width = to + 'px';
            await new Promise(function (resolve) {
              let done = false;
              function finish() {
                if (done) return;
                done = true;
                btn.style.width = '';
                btn.style.transition = '';
                resolve();
              }
              btn.addEventListener('transitionend', finish, { once: true });
              setTimeout(finish, 420);
            });
          }
        }
      }));
    }

    MoteSource.releases(30)
      .then(function (items) {
        if (!Array.isArray(items) || !items.length) {
          list.innerHTML = '<div class="card"><div class="state">还没有发布记录。</div></div>';
          return;
        }
        list.innerHTML = items.map(card).join('');
        hydrateDownloadSizes();
      })
      .catch(function () {
        MoteSource.releasesPageUrl().then(function (url) {
          list.innerHTML = '<div class="card"><div class="state">' +
            '加载失败，请前往 <a href="' + url + '" target="_blank" rel="noopener">Releases</a> 查看。' +
            '</div></div>';
        }).catch(function () {
          list.innerHTML = '<div class="card"><div class="state">加载失败，请稍后重试。</div></div>';
        });
      });
  })();
  </script>
</body>
</html>
