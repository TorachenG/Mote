<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理入口 · Mote</title>
<meta name="theme-color" content="#f4f7fb">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/mote_logo.png">
<link rel="stylesheet" href="assets/site.css">
<style>
  .stats-bar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  .toolbar .spacer{flex:1}
  .stats{display:flex;gap:38px;flex-wrap:wrap}
  .stat b{display:block;font-size:22px;font-weight:600;color:var(--text)}
  .stat span{color:var(--muted);font-size:12.5px;letter-spacing:.4px}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--muted);font-weight:500;font-size:12.5px;letter-spacing:.4px}
  tr:last-child td{border-bottom:0}
  td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted)}
  td.actions{white-space:nowrap}
  td.actions button + button{margin-left:6px}
  .tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px}
  .tag.on{background:#eaf7ef;color:var(--ok)}
  .tag.off{background:#fdeced;color:var(--danger)}
  .empty{padding:36px 0;text-align:center;color:var(--muted)}
  #message{min-height:20px;margin:2px 2px 12px;color:var(--muted);font-size:13px}
  #message.error{color:var(--danger)}
  #message.ok{color:var(--ok)}
  .hidden{display:none !important}

  .modal-mask{
    position:fixed;inset:0;background:rgba(60,72,92,.28);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:20px;width:380px;max-width:100%;box-shadow:0 24px 60px rgba(60,72,92,.22)}
  .modal h3{margin:0 0 14px;font-size:16px;color:var(--text);font-weight:600}
  .modal .row{justify-content:flex-end;margin-top:18px}

  @media (max-width:760px){
    .stats{gap:22px}
    table{font-size:13px}
    td.actions button{padding:5px 9px;font-size:12px}
  }

  @media (prefers-color-scheme: dark) {
    .tag.on{background:#1d2a22;color:#5fd08a}
    .tag.off{background:#2c1e20;color:#ff7b7f}
    .modal{background:#1e2127;box-shadow:0 24px 60px rgba(0,0,0,.5)}
    .modal h3{color:#e6e9ee}
    .modal-mask{background:rgba(8,10,14,.55)}
    #message{color:#8f97a4}
    #message.error{color:#ff7b7f}
    #message.ok{color:#5fd08a}
    td.mono{color:#8f97a4}
    .state{color:#8f97a4}
  }
</style>
</head>
<body>

  <div class="top">
    <a class="brand" href="./" aria-label="回到首页">
      <div class="org">[ TORACHEN ]</div>
      <div class="name">MOTE</div>
    </a>
    <nav>
      <a href="./">首页</a><i>|</i>
      <div class="nav-item">
        <a class="nav-link" href="javascript:void(0)">源码仓库</a>
        <div class="dropdown">
          <a href="https://github.com/TorachenG/Mote" target="_blank" rel="noopener">GitHub</a>
          <a href="https://gitee.com/TorachenG/Mote" target="_blank" rel="noopener">Gitee</a>
        </div>
      </div><i>|</i>
      <a href="changelog.html">更新日志</a><i>|</i>
      <div class="nav-item">
        <a class="nav-link" href="javascript:void(0)">用户协议</a>
        <div class="dropdown">
          <a href="legal/user-agreement.html">用户协议</a>
          <a href="legal/privacy-policy.html">隐私政策</a>
        </div>
      </div><i>|</i>
      <a href="developer.html" class="active">管理入口</a>
    </nav>
  </div>

  <div class="wrap" style="padding-top:12px">
    <div id="message"></div>

    <!-- 登录 -->
    <section id="loginView">
      <div class="card">
        <div class="row">
          <div class="grow">
            <label>云函数地址</label>
            <input id="url" placeholder="https://xxx.ap-shanghai.app.tcloudbase.com/moteauth">
          </div>
          <div class="keycol">
            <label>管理员密钥</label>
            <input id="key" type="password" placeholder="ADMIN_KEY">
          </div>
          <div>
            <button class="primary" id="enter">进入</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 管理面板 -->
    <section id="dashView" class="hidden">
      <div class="card">
        <div class="stats-bar">
          <div class="stats">
            <div class="stat"><b id="statTotal">-</b><span>账号总数</span></div>
            <div class="stat"><b id="statSynced">-</b><span>有云端数据</span></div>
            <div class="stat"><b id="statSize">-</b><span>数据总量</span></div>
            <div class="stat"><b id="statDisabled">-</b><span>已停用</span></div>
          </div>
          <div class="toolbar">
            <button id="refresh">刷新状态</button>
            <button id="logout">退出登录</button>
          </div>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>用户名</th>
              <th>UID</th>
              <th>注册时间</th>
              <th>最近同步</th>
              <th>数据量</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty">暂无账号</div>
      </div>
    </section>
  </div>

  <footer>
    源码基于 <a href="https://github.com/TorachenG/Mote/blob/main/LICENSE" data-mote-src="license" target="_blank" rel="noopener">Apache-2.0</a> 许可发布 · 第三方组件见 <a href="https://github.com/TorachenG/Mote/blob/main/NOTICE" data-mote-src="notice" target="_blank" rel="noopener">NOTICE</a><br>
    版权所有 © 2026 Torachen
  </footer>

  <div class="modal-mask" id="mask">
    <div class="modal">
      <h3 id="modalTitle">重置密码</h3>
      <input id="modalInput" placeholder="新密码（8~32 位）">
      <div class="row">
        <button id="modalCancel">取消</button>
        <button class="primary" id="modalOk">确定</button>
      </div>
    </div>
  </div>

<script src="assets/source.js"></script>
<script src="assets/nav.js"></script>
<script>
const LS_URL = "mote.admin.url";
const LS_KEY = "mote.admin.key";
const $ = (id) => document.getElementById(id);
const urlInput = $("url");
const keyInput = $("key");
const rowsEl = $("rows");
const emptyEl = $("empty");

urlInput.value = localStorage.getItem(LS_URL) || "";
keyInput.value = localStorage.getItem(LS_KEY) || "";
try {
  const params = new URLSearchParams(location.search);
  if (params.get("url")) urlInput.value = params.get("url");
} catch (e) {}

function setMessage(text, type) {
  const el = $("message");
  el.textContent = text || "";
  el.className = type || "";
}

function isLoggedIn() {
  return !$("dashView").classList.contains("hidden");
}

async function call(body) {
  const url = urlInput.value.trim();
  const key = keyInput.value.trim();
  if (!url) throw new Error("请先填写云函数地址");
  if (!key) throw new Error("请先填写管理员密钥");
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({}, body, { key: key })),
  });
  const json = await resp.json();
  if (json.code !== 0) throw new Error(json.message || "请求失败");
  return json.data;
}

function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function fmtSize(size) {
  if (!size) return "—";
  return size > 1024 ? (size / 1024).toFixed(1) + " KB" : size + " B";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function render(data) {
  const users = data.users || [];
  localStorage.setItem(LS_URL, urlInput.value.trim());
  localStorage.setItem(LS_KEY, keyInput.value.trim());

  $("statTotal").textContent = data.total != null ? data.total : users.length;
  $("statSynced").textContent = users.filter((u) => u.sync_at).length;
  $("statDisabled").textContent = users.filter((u) => u.disabled).length;
  const totalBytes = users.reduce((sum, u) => sum + (u.sync_size || 0), 0);
  $("statSize").textContent = totalBytes ? (totalBytes / 1024).toFixed(1) + " KB" : "0 B";

  rowsEl.innerHTML = "";
  if (!users.length) {
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  users.forEach((u) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + escapeHtml(u.username) + "</td>" +
      '<td class="mono">' + u.uid + "</td>" +
      "<td>" + fmtTime(u.created_at) + "</td>" +
      "<td>" + fmtTime(u.sync_at) + "</td>" +
      "<td>" + fmtSize(u.sync_size) + "</td>" +
      '<td><span class="tag ' + (u.disabled ? "off" : "on") + '">' +
        (u.disabled ? "已停用" : "正常") + "</span></td>" +
      '<td class="actions"></td>';

    const actions = tr.querySelector(".actions");

    const reset = document.createElement("button");
    reset.className = "small";
    reset.textContent = "重置密码";
    reset.onclick = () => resetPassword(u.username);
    actions.appendChild(reset);

    const toggle = document.createElement("button");
    toggle.className = "small";
    toggle.textContent = u.disabled ? "启用" : "停用";
    toggle.onclick = () => setDisabled(u.username, !u.disabled);
    actions.appendChild(toggle);

    const del = document.createElement("button");
    del.className = "small danger";
    del.textContent = "删除";
    del.onclick = () => removeUser(u.username);
    actions.appendChild(del);

    rowsEl.appendChild(tr);
  });
}

async function refresh() {
  setMessage("加载中…");
  try {
    const data = await call({ action: "adminList" });
    render(data);
    $("loginView").classList.add("hidden");
    $("dashView").classList.remove("hidden");
    setMessage("已加载 " + data.total + " 个账号", "ok");
  } catch (e) {
    setMessage("加载失败：" + e.message, "error");
    if (isLoggedIn()) {
      /* 面板内刷新失败只提示，不退出 */
    }
  }
}

$("enter").onclick = async () => {
  $("enter").disabled = true;
  await refresh();
  $("enter").disabled = false;
};

$("refresh").onclick = refresh;

$("logout").onclick = () => {
  localStorage.removeItem(LS_KEY);
  keyInput.value = "";
  $("dashView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  setMessage("");
};

let modalResolve = null;
function askInput(title, placeholder) {
  $("modalTitle").textContent = title;
  const input = $("modalInput");
  input.placeholder = placeholder;
  input.value = "";
  $("mask").classList.add("show");
  input.focus();
  return new Promise((resolve) => { modalResolve = resolve; });
}
$("modalCancel").onclick = () => {
  $("mask").classList.remove("show");
  if (modalResolve) modalResolve(null);
  modalResolve = null;
};
$("modalOk").onclick = () => {
  const v = $("modalInput").value.trim();
  $("mask").classList.remove("show");
  if (modalResolve) modalResolve(v || null);
  modalResolve = null;
};
$("modalInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("modalOk").click();
});

async function resetPassword(username) {
  const pwd = await askInput("重置 " + username + " 的密码", "新密码（8~32 位）");
  if (!pwd) return;
  try {
    await call({ action: "adminResetPassword", username: username, newPassword: pwd });
    setMessage("已重置 " + username + " 的密码", "ok");
  } catch (e) {
    setMessage("重置失败：" + e.message, "error");
  }
}

async function setDisabled(username, disabled) {
  try {
    await call({ action: "adminDisable", username: username, disabled: disabled });
    setMessage("已" + (disabled ? "停用" : "启用") + " " + username, "ok");
    refresh();
  } catch (e) {
    setMessage("操作失败：" + e.message, "error");
  }
}

async function removeUser(username) {
  if (!confirm("确定删除账号「" + username + "」？\n\n会同时删除他的云端同步数据，不可恢复。")) return;
  try {
    await call({ action: "adminDelete", username: username });
    setMessage("已删除 " + username + " 及其云端数据", "ok");
    refresh();
  } catch (e) {
    setMessage("删除失败：" + e.message, "error");
  }
}
</script>
</body>
</html>
