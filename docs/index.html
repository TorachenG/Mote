<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mote · 轻快、纯净的 Android 浏览器</title>
<meta name="description" content="Mote —— 轻快、纯净的 Android 浏览器。">
<meta name="theme-color" content="#f4f7fb">
<link rel="icon" href="assets/icon.png">
<style>
  :root{
    --ink:#8b93a1;
    --nav:#8b93a0;
    --sep:#c9cfd8;
    --brand:#c6cfdb;
    --blue:#2f7bf6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 700px at 12% 0%, rgba(255,255,255,.95), transparent 60%),
      linear-gradient(140deg,#f8f9fb 0%,#f4f7fb 42%,#e9eff8 100%);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- 顶部 ---------- */
  .top{
    position:absolute;inset:0 0 auto 0;
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:44px 56px;
    gap:24px;
  }
  .brand{line-height:1}
  .brand .org{
    font-size:14px;letter-spacing:2.6px;font-weight:500;
    color:#9aa3b0;
  }
  .brand .name{
    margin-top:8px;
    font-size:62px;font-weight:200;letter-spacing:8px;
    color:var(--brand);
  }
  nav{display:flex;align-items:center;flex-wrap:wrap;gap:18px;padding-top:2px}
  nav a{
    color:var(--nav);text-decoration:none;font-size:14.5px;letter-spacing:.5px;
    transition:color .18s;
  }
  nav a:hover{color:#4b5563}
  nav i{font-style:normal;color:var(--sep);font-size:14px}

  /* ---------- 主体 ---------- */
  main{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:150px 24px 80px;
  }
  .star{
    width:clamp(104px,7.9vw,138px);height:auto;display:block;
    margin-bottom:clamp(24px,3.6vw,46px);
    filter:drop-shadow(0 10px 26px rgba(120,150,200,.10));
  }
  h1{
    margin:0;
    font-size:clamp(26px,3.15vw,54px);
    font-weight:700;
    letter-spacing:.5px;
    line-height:1.18;
    background:linear-gradient(94deg,#a8b0bb 0%,#9aa7bd 30%,#7f9cc9 64%,#6d93d0 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    max-width:100%;
    word-break:break-word;
  }
  .meta{
    margin:clamp(14px,2vw,26px) 0 0;
    font-size:clamp(12px,.86vw,14.5px);
    letter-spacing:1.2px;
    color:#939ba8;
  }
  .meta .sep{color:#c3cad4;margin:0 .5em}
  .dl{
    display:inline-block;
    margin-top:clamp(18px,2.6vw,32px);
    padding:clamp(9px,.72vw,12px) clamp(20px,1.3vw,24px);
    border-radius:999px;
    background:var(--blue);
    color:#fff;text-decoration:none;
    font-size:clamp(13px,.9vw,15.5px);font-weight:500;letter-spacing:.5px;
    box-shadow:0 8px 22px rgba(47,123,246,.22);
    transition:transform .16s, box-shadow .2s, background .2s;
  }
  .dl:hover{background:#2a70e4;box-shadow:0 12px 28px rgba(47,123,246,.32)}
  .dl:active{transform:translateY(1px)}
  .tags{
    max-width:100%;
    word-break:break-word;
    margin:clamp(20px,3vw,38px) 0 0;
    font-size:clamp(12.5px,.95vw,16px);
    letter-spacing:5px;
    color:#8e96a3;
  }
  .tags i{font-style:normal;color:#c3cad4;letter-spacing:0;margin:0 clamp(8px,1vw,16px)}

  /* ---------- 底部 ---------- */
  footer{
    padding:0 24px 34px;
    text-align:center;
    color:#98a0ac;
    font-size:13px;
    line-height:1.85;
    letter-spacing:.5px;
  }

  @media (max-width:760px){
    .top{padding:22px 20px;flex-direction:column;gap:14px}
    .brand .name{font-size:34px;letter-spacing:5px;margin-top:5px}
    .brand .org{font-size:11.5px;letter-spacing:2px}
    nav{gap:10px;padding-top:0}
    nav a{font-size:13px}
    main{padding:128px 16px 64px}
    h1{font-size:clamp(21px,5.4vw,30px);letter-spacing:0}
    .meta{letter-spacing:.6px}
    .tags{font-size:11.5px;letter-spacing:1px;line-height:2}
    .tags i{margin:0 6px}
    footer{padding-bottom:26px;font-size:12px}
  }
</style>
</head>
<body>

  <div class="top">
    <div class="brand">
      <div class="org">[ TORACHEN ]</div>
      <div class="name">MOTE</div>
    </div>
    <nav>
      <a href="https://gitee.com/TorachenG/Mote" target="_blank" rel="noopener">Gitee</a><i>|</i>
      <a href="https://github.com/TorachenG/Mote" target="_blank" rel="noopener">Github</a><i>|</i>
      <a href="https://github.com/TorachenG/Mote/releases" target="_blank" rel="noopener">更新日志</a><i>|</i>
      <a href="https://github.com/TorachenG/Mote/blob/main/docs/legal/user-agreement.md" target="_blank" rel="noopener">用户协议</a><i>|</i>
      <a href="https://github.com/TorachenG/Mote/blob/main/docs/legal/privacy-policy.md" target="_blank" rel="noopener">隐私政策</a>
    </nav>
  </div>

  <main>
    <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="starGrad" x1="8%" y1="4%" x2="88%" y2="96%">
          <stop offset="0%" stop-color="#EDF2FA"/>
          <stop offset="42%" stop-color="#CBDCF2"/>
          <stop offset="100%" stop-color="#89AADB"/>
        </linearGradient>
      </defs>
      <path d="M50 1.5 C51.6 27.2 72.8 48.4 98.5 50 C72.8 51.6 51.6 72.8 50 98.5 C48.4 72.8 27.2 51.6 1.5 50 C27.2 48.4 48.4 27.2 50 1.5 Z"
            fill="url(#starGrad)"/>
    </svg>

    <h1>轻快、纯净的 Android 浏览器</h1>

    <p class="meta">
      版本 <span id="ver">0.3.0</span><span class="sep">｜</span><span id="date">2026 / 10 / 22</span>
    </p>

    <a class="dl" id="dl" href="https://github.com/TorachenG/Mote/releases/latest">下载<span id="size">（83.7MB）</span></a>

    <p class="tags">
      简洁纯净<i>｜</i>极速流畅<i>｜</i>功能全面<i>｜</i>高度定制
    </p>
  </main>

  <footer>
    基于 Apache-2.0 许可发布<br>
    版权所有 © 2026 Torachen
  </footer>

<script>
(async function () {
  const verEl = document.getElementById('ver');
  const dateEl = document.getElementById('date');
  const sizeEl = document.getElementById('size');
  const dl = document.getElementById('dl');
  try {
    const res = await fetch('https://api.github.com/repos/TorachenG/Mote/releases/latest', {
      headers: { Accept: 'application/vnd.github+json' }
    });
    if (!res.ok) return;
    const data = await res.json();
    const apk = (data.assets || []).find(a => /\.apk$/i.test(a.name));
    const tag = (data.tag_name || '').replace(/^v/i, '');
    if (tag) verEl.textContent = tag;
    if (data.published_at) {
      const d = new Date(data.published_at);
      const p = n => String(n).padStart(2, '0');
      dateEl.textContent = `${d.getFullYear()} / ${p(d.getMonth() + 1)} / ${p(d.getDate())}`;
    }
    if (apk) {
      sizeEl.textContent = `（${(apk.size / 1048576).toFixed(1)}MB）`;
      dl.href = apk.browser_download_url;
    }
  } catch (e) {
    /* 保持页面里的静态默认值 */
  }
})();
</script>
</body>
</html>
