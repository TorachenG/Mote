<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mote</title>
<meta name="description" content="Mote —— 轻快、纯净的 Android 浏览器。">
<meta name="theme-color" content="#f4f7fb">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/mote_logo.png">
<link rel="stylesheet" href="assets/site.css">
<style>
  main{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:150px 24px 80px;
  }
  .star{
    width:clamp(104px,7.9vw,138px);height:auto;display:block;
    margin-bottom:clamp(24px,3.6vw,46px);
    filter:drop-shadow(0 10px 26px rgba(120,150,200,.10));
  }
  h1{
    margin:0;
    font-size:clamp(26px,3.15vw,54px);
    font-weight:700;
    letter-spacing:.5px;
    line-height:1.18;
    background:linear-gradient(94deg,#a8b0bb 0%,#9aa7bd 30%,#7f9cc9 64%,#6d93d0 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    max-width:100%;
    word-break:break-word;
  }
  .meta{
    margin:clamp(14px,2vw,26px) 0 0;
    font-size:clamp(12px,.86vw,14.5px);
    letter-spacing:1.2px;
    color:#939ba8;
  }
  .meta .sep{color:#c3cad4;margin:0 .5em}
  .dl{
    display:inline-flex;
    align-items:center;
    margin-top:clamp(18px,2.6vw,32px);
    padding:clamp(9px,.72vw,12px) clamp(20px,1.3vw,24px);
    border-radius:999px;
    background:var(--blue);
    color:#fff;text-decoration:none;
    font-size:clamp(13px,.9vw,15.5px);font-weight:500;letter-spacing:.5px;
    box-shadow:0 8px 22px rgba(47,123,246,.22);
    transition:transform .16s, box-shadow .2s, background .2s;
  }
  .dl:hover{background:#2a70e4;box-shadow:0 12px 28px rgba(47,123,246,.32)}
  .dl:active{transform:translateY(1px)}
  .tags{
    max-width:100%;
    word-break:break-word;
    margin:clamp(20px,3vw,38px) 0 0;
    font-size:clamp(12.5px,.95vw,16px);
    letter-spacing:5px;
    color:#8e96a3;
  }
  .tags i{font-style:normal;color:#c3cad4;letter-spacing:0;margin:0 clamp(8px,1vw,16px)}

  @keyframes rise {
    from { opacity: 0; transform: translate3d(0, 26px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  main > * {
    animation: rise .78s cubic-bezier(.22,1,.36,1) backwards;
    will-change: transform, opacity;
  }

  @keyframes starDrop {
    from { opacity: 0; transform: translate3d(0, -78px, 0) rotate(-340deg); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg); }
  }
  main > .star {
    animation: starDrop 2.1s cubic-bezier(.18,.9,.24,1) .06s backwards;
    will-change: transform, opacity;
  }

  main > h1    { animation-delay: .15s }
  main > .meta { animation-delay: .24s }
  main > .dl   { animation-delay: .33s }
  main > .tags { animation-delay: .42s }

  @media (prefers-reduced-motion: reduce) {
    main > * { animation: none }
  }

  @media (prefers-color-scheme: dark) {
    h1{
      background:linear-gradient(94deg,#c9d3e3 0%,#adc0dc 30%,#93b3e6 64%,#7ea6e0 100%);
      -webkit-background-clip:text;background-clip:text;
    }
    .meta{color:#8d95a3}
    .tags{color:#8992a1}
    .tags i{color:#4a515c}
    .star{filter:drop-shadow(0 10px 26px rgba(90,140,230,.18))}
  }

  /* ---------- 整页滑动（第二屏：已废弃项目） ---------- */
  html,body{height:100%;overflow:hidden}
  body{min-height:0}
  #pages{position:relative;height:100svh;overflow-y:auto;overscroll-behavior:contain;
    scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .page{position:relative;height:100svh;display:flex;flex-direction:column;overflow:hidden;
    scroll-snap-align:start;scroll-snap-stop:always}
  .page-one > main{flex:1}
  .legacy{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:clamp(42px,5.4vh,86px) 20px 10px;
    width:100%;max-width:min(1080px,100%);max-height:min(86vh,860px);margin:0 auto}
  .legacy-title{margin:0 0 clamp(22px,3vw,40px);font-size:clamp(20px,2vw,40px);font-weight:600;letter-spacing:1px;
    background:linear-gradient(94deg,#a8b0bb 0%,#9aa7bd 34%,#7f9cc9 68%,#6d93d0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .legacy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,44px);width:min(880px,100%)}
  .legacy-card{display:flex;flex-direction:column;align-items:center;gap:clamp(7px,.9vw,11px);
    padding:clamp(20px,2.4vw,34px) clamp(14px,2vw,28px);border-radius:22px;text-decoration:none;color:inherit;
    background:rgba(255,255,255,.72);border:1px solid rgba(120,150,200,.16);
    box-shadow:0 18px 40px rgba(90,120,170,.10);
    transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s,border-color .22s}
  .legacy-card:hover{transform:translateY(-4px);box-shadow:0 26px 52px rgba(90,120,170,.18);border-color:rgba(47,123,246,.35)}
  .legacy-icon{width:clamp(62px,5.4vw,112px);height:auto;border-radius:20px;box-shadow:0 10px 24px rgba(60,90,140,.18)}
  .legacy-name{font-size:clamp(15px,1.15vw,20px);font-weight:600;color:#56606f;letter-spacing:.5px}
  .legacy-ver{font-size:clamp(11.5px,.82vw,13px);color:#98a0ac;letter-spacing:1px}
  .legacy-btn{margin-top:clamp(6px,.8vw,10px);padding:8px 20px;border-radius:999px;background:var(--blue);color:#fff;
    font-size:clamp(12px,.85vw,14px);letter-spacing:.5px;box-shadow:0 8px 20px rgba(47,123,246,.22)}
  .legacy-hint{position:absolute;left:50%;bottom:clamp(16px,2.6vh,30px);transform:translateX(-50%);
    font-size:12.5px;letter-spacing:2px;color:#a7aeba}
  .dots{position:fixed;right:clamp(12px,2vw,26px);top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:10px;z-index:60}
  .dots button{width:9px;height:9px;padding:0;border:0;border-radius:50%;
    background:rgba(140,155,175,.35);cursor:pointer;transition:background .2s,transform .2s}
  .dots button.on{background:var(--blue);transform:scale(1.28)}
  /* 手机也保持左右并排，只收窄间距与图标 */
  @media (max-width:640px){
    .legacy-grid{gap:12px}
    .legacy-card{padding:18px 10px;border-radius:18px}
    .legacy-icon{width:56px;border-radius:16px}
  }
  @media (prefers-color-scheme: dark){
    .legacy-title{background:linear-gradient(94deg,#c9d3e3 0%,#adc0dc 30%,#93b3e6 64%,#7ea6e0 100%);
      -webkit-background-clip:text;background-clip:text}
    .legacy-card{background:rgba(24,27,33,.72);border-color:rgba(120,150,200,.18);box-shadow:0 18px 40px rgba(0,0,0,.35)}
    .legacy-card:hover{border-color:rgba(122,166,224,.5)}
    .legacy-name{color:#c7d0de}
  }
  @media (prefers-reduced-motion: reduce){
    #pages{scroll-behavior:auto}
  }

  /* ---------- 文案强调色（MIUIX 蓝） ---------- */
  .tags{letter-spacing:2px}
  .accent{color:#3482ff;letter-spacing:2px}
  /* ---------- 第一页底部提示 ---------- */
  .scroll-hint{position:absolute;left:50%;bottom:clamp(14px,2.4vh,28px);transform:translateX(-50%);
    font-size:12.5px;letter-spacing:2px;color:#a7aeba;pointer-events:none}

  .legacy{padding:clamp(42px,5.4vh,86px) 20px 10px}

  .drawer-mask.open{opacity:1;pointer-events:auto}

  }
  @media (prefers-color-scheme: dark){
    .nav-toggle{background:rgba(28,32,40,.7);color:#c7d0de;border-color:rgba(120,150,200,.25)}
    .drawer{background:rgba(22,25,31,.58);

    letter-spacing:3px;color:#5a6573;transition:opacity .22s}
  .showcase-card{width:min(620px,100%);border-radius:24px;overflow:hidden;
    background:rgba(255,255,255,.72);border:1px solid rgba(120,150,200,.16);
    box-shadow:0 22px 50px rgba(90,120,170,.12);padding:clamp(10px,1.4vw,18px)}
  .showcase-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
  .showcase-track::-webkit-scrollbar{display:none}
  .shot-slide{flex:0 0 100%;scroll-snap-align:center;margin:0;
    display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.2vh,12px)}
  .shot-slide img{height:clamp(200px,42vh,400px);width:auto;max-width:100%;border-radius:14px;

  .shot-slide figcaption{font-size:clamp(11.5px,1vw,15px);line-height:1.8;color:#7a8290;
    max-width:min(560px,92%);margin:0 0 2px}
  .showcase-dots{display:flex;gap:8px;margin-top:clamp(10px,1.8vh,16px)}
  .showcase-dots i{width:7px;height:7px;border-radius:50%;background:rgba(140,155,175,.35);
    transition:background .2s,transform .2s}
  .showcase-dots i.on{background:#3482ff;transform:scale(1.25)}
  @media (prefers-color-scheme: dark){
    .showcase-title{color:#c7d0de}
    .showcase-card{background:rgba(24,27,33,.72);border-color:rgba(120,150,200,.18);box-shadow:0 22px 50px rgba(0,0,0,.4)}

  }
</style>

<script>
(async function () {
  const verEl = document.getElementById('ver');
  const dateEl = document.getElementById('date');
  const sizeEl = document.getElementById('size');
  const dl = document.getElementById('dl');

  // 大小文字出现时让按钮宽度平滑展开
  function applySize(text) {
    sizeEl.textContent = text;
    sizeEl.style.display = 'inline-block';
    sizeEl.style.overflow = 'hidden';
    sizeEl.style.whiteSpace = 'nowrap';
    const target = sizeEl.getBoundingClientRect().width || sizeEl.scrollWidth;
    if (!target || !sizeEl.animate) {
      sizeEl.style.width = '';
      return;
    }
    sizeEl.style.width = '0px';
    // 强制回流，保证从 0 开始过渡
    void sizeEl.offsetWidth;
    sizeEl.style.transition = 'width 320ms cubic-bezier(0.22, 0.61, 0.36, 1)';
    sizeEl.style.width = target + 'px';
    sizeEl.addEventListener('transitionend', function done() {
      sizeEl.removeEventListener('transitionend', done);
      sizeEl.style.width = '';
      sizeEl.style.transition = '';
    });
  }

  try {
    const p = n => String(n).padStart(2, '0');

    MoteSource.releasesPageUrl().then(url => { dl.href = url; }).catch(() => {});

    const rel = await MoteSource.latestRelease();
    if (!rel) return;
    if (rel.tag) verEl.textContent = rel.tag;
    if (rel.publishedAt) {
      const d = new Date(rel.publishedAt);
      dateEl.textContent = `${d.getFullYear()} / ${p(d.getMonth() + 1)} / ${p(d.getDate())}`;
    }
    const apk = (rel.assets || []).find(a => /\.apk$/i.test(a.name || ''));
    if (apk) {
      dl.href = apk.url;
      // Gitee 的 assets 不带大小：优先 HEAD 读取 Content-Length，
      // 再退化为 GitHub API 的 asset.size，三层都失败才保留页面原有文字
      let bytes = apk.size || 0;
      if (!bytes && apk.url) {
        try {
          const head = await fetch(apk.url, { method: 'HEAD' });
          const len = head.headers.get('content-length');
          if (len) bytes = Number(len) || 0;
        } catch (e) {}
      }
      if (!bytes) {
        try {
          const gh = await fetch(
            'https://api.github.com/repos/TorachenG/Mote/releases?per_page=10',
            { headers: { Accept: 'application/vnd.github+json' } }
          );
          if (gh.ok) {
            const list = await gh.json();
            if (Array.isArray(list) && list.length) {
              const same = list.find(function (r) {
                return String(r.tag_name || '').replace(/^v/i, '') === rel.tag;
              });
              const pick = same || list[0];
              const asset = ((pick && pick.assets) || [])
                .find(function (a) { return /\.apk$/i.test(a.name || ''); });
              if (asset && asset.size) bytes = asset.size;
            }
          }
        } catch (e) {}
      }
      if (bytes > 0) {
        applySize(`（${(bytes / 1048576).toFixed(1)}MB）`);
      }
    } else if (rel.pageUrl) {
      dl.href = rel.pageUrl;
    }
  } catch (e) {}
})();
</script>
<script>
/* 整页滑动：原生滚动吸附，一次滑动直接停在下一页 */
(function () {
  const pages = document.getElementById('pages');
  if (!pages) return;
  const sections = Array.from(pages.querySelectorAll('.page'));
  const dotWrap = document.getElementById('pageDots');
  let index = 0;

  // 按页数生成圆点
  const dots = [];
  if (dotWrap) {
    dotWrap.innerHTML = '';
    sections.forEach(function (_, i) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', '第 ' + (i + 1) + ' 页');
      if (i === 0) b.classList.add('on');
      b.addEventListener('click', function () { go(i); });
      dotWrap.appendChild(b);
      dots.push(b);
    });
  }

  function pageHeight() { return pages.clientHeight; }

  function sync() {
    const h = pageHeight();
    if (!h) return;
    index = Math.max(0, Math.min(sections.length - 1, Math.round(pages.scrollTop / h)));
    dots.forEach(function (d, k) { d.classList.toggle('on', k === index); });
    if (history.replaceState) {
      history.replaceState(null, '', index === 0 ? location.pathname + location.search : '#p' + (index + 1));
    }
  }

  function go(k) {
    const h = pageHeight();
    pages.scrollTo({ top: h * Math.max(0, Math.min(sections.length - 1, k)), behavior: 'smooth' });
  }

  pages.addEventListener('scroll', sync, { passive: true });
  window.addEventListener('resize', sync);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(index + 1); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); go(index - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(sections.length - 1); }
  });
  // 支持 #p2 / #p3 直接定位（也方便分享）
  (function () {
    const m = (location.hash || '').match(/^#p([1-9]\d*)$/);
    if (!m) return;
    const k = Math.max(0, Math.min(sections.length - 1, Number(m[1]) - 1));
    pages.scrollTop = pageHeight() * k;
  })();
  sync();

  /* 展示页：卡片内横向滑动切换，标题随之改变 */
  const track = document.getElementById('showcaseTrack');
  const titleEl = document.getElementById('showcaseTitle');
  const shotDots = document.getElementById('showcaseDots');
  if (track && titleEl && shotDots) {
    const titles = ['干净', '强大', '安全', '定制', '时尚'];
    const slides = Array.from(track.children);
    const marks = [];
    slides.forEach(function (_, i) {
      const m = document.createElement('i');
      if (i === 0) m.classList.add('on');
      shotDots.appendChild(m);
      marks.push(m);
    });
    let shotIndex = 0;
    function syncShowcase() {
      const w = track.clientWidth || 1;
      const idx = Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / w)));
      if (idx === shotIndex) return;
      shotIndex = idx;
      titleEl.style.opacity = '0';
      window.setTimeout(function () {
        titleEl.textContent = titles[idx] || '';
        titleEl.style.opacity = '1';
      }, 130);
      marks.forEach(function (m, k) { m.classList.toggle('on', k === idx); });
    }
    track.addEventListener('scroll', syncShowcase, { passive: true });
    window.addEventListener('resize', syncShowcase);
  }
})();
</script>
<script>
/* 窄屏导航抽屉 */
(function () {
  const toggle = document.getElementById('navToggle');
  const drawer = document.getElementById('drawer');
  const mask = document.getElementById('drawerMask');
  if (!toggle || !drawer || !mask) return;
  function setOpen(open) {
    drawer.classList.toggle('open', open);
    mask.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
  }
  toggle.addEventListener('click', function () { setOpen(!drawer.classList.contains('open')); });
  mask.addEventListener('click', function () { setOpen(false); });
  drawer.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setOpen(false); }); });
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
})();
</script>
