<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mote 书签同步</title>
<style>
  :root{--text:#4b5563;--muted:#98a0ac;--blue:#2f7bf6;--ok:#1f9d55;--danger:#e5484d;color-scheme:light}
  *{box-sizing:border-box}
  body{
    width:280px;margin:0;padding:16px;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:#ffffff;
    color-scheme:light;
  }
  .title{font-size:15px;font-weight:600;margin:0 0 4px;color:#3f4855}
  .state{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#c9cfd8}
  .dot.ok{background:var(--ok)}
  .dot.err{background:var(--danger)}
  .dot.syncing{background:var(--blue)}
  .meta{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px;word-break:break-word}
  button{
    width:100%;border:0;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;
    background:#eef2f8;color:var(--text);transition:background .16s;
  }
  button:hover{background:#e7edf6}
  button.primary{background:var(--blue);color:#fff;margin-bottom:8px}
  button.primary:hover{background:#2a70e4}
  button:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
  <p class="title">Mote 书签同步</p>
  <div class="state"><span class="dot" id="dot"></span><span id="stateText">未同步</span></div>
  <div class="meta" id="meta">—</div>
  <button class="primary" id="sync">立即同步</button>
  <button id="options">打开设置</button>
  <script src="popup.js"></script>
</body>
</html>
